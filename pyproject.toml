[project]
name = "projectarrange"
version = "0.1.0"
description = "CLI tool that automatically organizes your Downloads folder into clean subfolders"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.15",
    "rich>=13.0",
    "watchdog>=4.0",
    "python-magic>=0.4",
]

[project.scripts]
projectarrange = "projectarrange.cli:app"

[project.urls]
"Homepage" = "https://github.com/kaiser9820/ProjectArrange"
"Repository" = "https://github.com/kaiser9820/ProjectArrange"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"